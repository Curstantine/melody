[package]
name = "ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
default-run = "melody"

[[bin]]
name = "melody"
path = "src/main.rs"

[package.metadata.winres]
name = "Melody"
FileDescription = "Melody"
ProductName = "Melody"
OriginalFilename = "melody.exe"

[dependencies]
path.workspace = true
model.workspace = true
playlist.workspace = true
thumbnail.workspace = true
metadata.workspace = true
db.workspace = true
audio.workspace = true
plugin.workspace = true
updater.workspace = true
theme.workspace = true
font.workspace = true
layout.workspace = true
queue.workspace = true
config.workspace = true
component.workspace = true

# NOTE: `web-colors` (an iced default feature) is deliberately disabled: it
# switches the wgpu text pipeline to non-gamma-corrected ("Web") blending,
# which renders glyph edges thinner/sharper than 0.13. Opting out restores
# gamma-correct ("Accurate") blending. Everything else mirrors iced defaults.
iced = { workspace = true, features = [
  "wgpu",
  "crisp",
  "thread-pool",
  "linux-theme-detection",
  "x11",
  "wayland",
  "wayland-dlopen",
  "wayland-decorations",
  "tokio",
  "svg",
  "image",
  "advanced",
] }
crossbeam-channel.workspace = true
rfd.workspace = true
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio = { workspace = true, features = ["rt", "time"] }
tray-icon.workspace = true
image = { workspace = true, features = ["png"] }
url.workspace = true

# Profiling dependencies (optional)
tracy-client = { workspace = true, optional = true, default-features = false, features = ["enable"] }
tracing-tracy = { workspace = true, optional = true }

[features]
default = ["ffmpeg"]
ffmpeg = ["audio/ffmpeg", "metadata/ffmpeg"]
symphonia = ["audio/symphonia", "metadata/symphonia"]
tracy = ["dep:tracy-client", "dep:tracing-tracy"]
hot = ["iced/hot"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"
