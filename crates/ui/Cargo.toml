[package]
name = "ui"
workspace = "../.."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "melody"

[[bin]]
name = "melody"
path = "src/main.rs"

[package.metadata.appimage]
name = "Melody"
icon = "../../assets/melody.png"
desktop_entry = "../../assets/melody.desktop"
assets = [
    "../../themes",
    "../../layouts",
]
auto_link = false

[package.metadata.wix]
name = "Melody"
path-guid = "0750FF61-7342-4681-8E6B-A349D2D293F6"
upgrade-guid = "37AEE279-1BDE-4A0F-96B1-7145E5003745"
product-icon = "wix/Product.ico"

[package.metadata.winres]
name = "Melody"
FileDescription = "Melody"
ProductName = "Melody"
OriginalFilename = "melody.exe"

[dependencies]
core_engine.workspace = true
audio.workspace = true
plugins.workspace = true
# NOTE: `web-colors` (an iced default feature) is deliberately disabled: it
# switches the wgpu text pipeline to non-gamma-corrected ("Web") blending,
# which renders glyph edges thinner/sharper than 0.13. Opting out restores
# gamma-correct ("Accurate") blending. Everything else mirrors iced defaults.
iced = { workspace = true, features = [
  "wgpu",
  "tiny-skia",
  "crisp",
  "thread-pool",
  "linux-theme-detection",
  "x11",
  "wayland",
  "wayland-dlopen",
  "wayland-decorations",
  "tokio",
  "svg",
  "image",
  "advanced",
] }
crossbeam-channel.workspace = true
kdl.workspace = true
serde = { workspace = true, features = ["derive"] }
toml.workspace = true
walkdir.workspace = true
rfd.workspace = true
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
url.workspace = true

# Profiling dependencies (optional)
tracy-client = { workspace = true, optional = true, default-features = false, features = ["enable"] }
tracing-tracy = { workspace = true, optional = true }

[features]
default = []
tracy = ["dep:tracy-client", "dep:tracing-tracy"]

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
