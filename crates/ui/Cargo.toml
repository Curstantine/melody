[package]
name = "ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "melody"

[[bin]]
name = "melody"
path = "src/main.rs"

[dependencies]
core_engine.workspace = true
audio.workspace = true
plugins.workspace = true
# NOTE: `web-colors` (an iced default feature) is deliberately disabled: it
# switches the wgpu text pipeline to non-gamma-corrected ("Web") blending,
# which renders glyph edges thinner/sharper than 0.13. Opting out restores
# gamma-correct ("Accurate") blending. Everything else mirrors iced defaults.
iced = { workspace = true, features = [
  "wgpu",
  "tiny-skia",
  "crisp",
  "thread-pool",
  "linux-theme-detection",
  "x11",
  "wayland",
  "wayland-dlopen",
  "wayland-decorations",
  "tokio",
  "svg",
  "image",
  "advanced",
  "debug",
] }
crossbeam-channel.workspace = true
kdl.workspace = true
serde = { workspace = true, features = ["derive"] }
toml.workspace = true
walkdir.workspace = true
rfd.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
url.workspace = true
