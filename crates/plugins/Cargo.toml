[package]
name = "plugins"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
core_engine = { package = "core", path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
extism = { version = "1.41", optional = true }
ureq = { version = "3.4.2", features = ["json"] }
md-5 = "0.11.0"

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.10.0"
async-io = "2.6"
futures-lite = "2.6"
crossbeam-channel = "0.5"
url = "2.5"

[features]
default = []
wasm = ["extism"]
