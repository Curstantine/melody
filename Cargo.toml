[workspace]
resolver = "2"
members = ["crates/core", "crates/audio", "crates/plugins", "crates/ui"]

[workspace.package]
version = "0.3.2"
edition = "2021"
authors = ["Curstantine <Curstantine@proton.me>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
core_engine = { package = "core", path = "crates/core" }
audio = { path = "crates/audio" }
plugins = { path = "crates/plugins" }

async-io = "2.6"
cpal = "0.18"
crossbeam-channel = "0.5"
directories = "6.0"
encoding_rs = "0.8"
extism = "1.41"
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-resampling"] }
futures-lite = "2.6"
iced = { git = "https://github.com/iced-rs/iced.git", rev = "ab336f6d6403d7206d82c7c2caa46143efde8284", default-features = false }
image = { version = "0.25", default-features = false }
kdl = { version = "6.7.1", features = ["v1-fallback"] }
md-5 = "0.11.0"
mpris-server = "0.10.0"
notify = "8.0.0"
rfd = "0.17"
ringbuf = "0.5"
serde = "1.0"
serde_json = "1.0"
thiserror = "2.0"
tokio = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-tracy = "0.11"
tracy-client = { version = "0.18", default-features = false }
turso = { version = "0.8.3", default-features = false }
ureq = "3.4.2"
url = "2.5"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = "fat"

[profile.profile]
inherits = "release"
debug = true
split-debuginfo = "packed"
