[workspace]
resolver = "2"
members = [
    "crates/paths",
    "crates/model",
    "crates/thumbnail",
    "crates/metadata",
    "crates/db",
    "crates/audio",
    "crates/plugins",
    "crates/updater",
    "crates/theme",
    "crates/layout",
    "crates/queue",
    "crates/config",
    "crates/components",
    "crates/ui",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
authors = ["Curstantine <Curstantine@proton.me>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Curstantine/melody"

[workspace.dependencies]
paths = { path = "crates/paths" }
model = { path = "crates/model" }
thumbnail = { path = "crates/thumbnail" }
metadata = { path = "crates/metadata" }
db = { path = "crates/db" }
audio = { path = "crates/audio" }
plugins = { path = "crates/plugins" }
updater = { path = "crates/updater" }
theme = { path = "crates/theme" }
layout = { path = "crates/layout" }
queue = { path = "crates/queue" }
config = { path = "crates/config" }
components = { path = "crates/components" }

async-io = "2.6"
cpal = "0.18"
crossbeam-channel = "0.5"
directories = "6.0"
encoding_rs = "0.8"
extism = "1.41"
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-resampling"] }
futures-lite = "2.6"
iced = { git = "https://github.com/iced-rs/iced.git", rev = "8ff48c42b0d5188223501ea1ccc506fd5beaf36a", default-features = false }
image = { version = "0.25", default-features = false }
kdl = { version = "6.7", features = ["v1-fallback"] }
md-5 = "0.11"
mpris-server = "0.11.0"
notify = "8.2"
rfd = "0.18"
ringbuf = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = "1"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-tracy = "0.12"
tracy-client = { version = "0.19", default-features = false }
turso = { version = "0.8", default-features = false }
ureq = "3.5"
url = "2.5"
velopack = "1.2"
walkdir = "2.5"
windows = "0.62"

[profile.release]
opt-level = 3
lto = "fat"

[profile.profile]
inherits = "release"
debug = true
split-debuginfo = "packed"
