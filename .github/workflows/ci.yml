name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Enable Rust caching
        uses: Swatinem/rust-cache@v2

      # --- Linux Dependencies ---
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev

      # --- Windows Dependencies ---
      - name: Set up FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z"
          $archive = "$env:TEMP\ffmpeg-release-full-shared.7z"
          $dest = "C:\ffmpeg"

          Write-Host "Downloading FFmpeg full-shared archive from $url..."
          Invoke-WebRequest -Uri $url -OutFile $archive

          Write-Host "Extracting archive to $dest..."
          7z x $archive "-o$dest" -y | Out-Null

          $extractedRoot = (Get-ChildItem -Path $dest -Directory | Select-Object -First 1).FullName
          Write-Host "Discovered FFmpeg Root: $extractedRoot"

          $binDir = Join-Path $extractedRoot "bin"
          $includeDir = Join-Path $extractedRoot "include"
          $libDir = Join-Path $extractedRoot "lib"

          Write-Host "FFmpeg Bin: $binDir"
          Write-Host "FFmpeg Include: $includeDir"
          Write-Host "FFmpeg Lib: $libDir"

          # ffmpeg-sys-next looks for FFMPEG_DIR containing include/ and lib/
          "FFMPEG_DIR=$extractedRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$binDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # --- Workspace Verification ---
      - name: Check code formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --verbose

      - name: Run test suite
        run: cargo test --workspace --verbose
