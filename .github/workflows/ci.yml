name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Enable Rust caching
        uses: Swatinem/rust-cache@v2

      # --- Linux Dependencies ---
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev

      # --- FFmpeg (Windows & Linux) ---
      - name: Set up minimal FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      # --- Workspace Verification ---
      - name: Check code formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build bundled WASM extensions
        run: |
          cargo build -p melody-ext-lastfm -p melody-ext-listenbrainz --target wasm32-unknown-unknown --release
          cp target/wasm32-unknown-unknown/release/melody_ext_lastfm.wasm extensions/lastfm/extension.wasm
          cp target/wasm32-unknown-unknown/release/melody_ext_listenbrainz.wasm extensions/listenbrainz/extension.wasm
        shell: bash

      - name: Build workspace
        run: cargo build --workspace --verbose

      - name: Run test suite
        run: cargo test --workspace --verbose
