name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: melody
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: melody.exe
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Enable Rust caching
        uses: Swatinem/rust-cache@v2

      # --- Linux Dependencies ---
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libfuse2

      # --- Windows Dependencies ---
      - name: Set up FFmpeg (Windows)
        id: setup-ffmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z"
          $archive = "$env:TEMP\ffmpeg-release-full-shared.7z"
          $dest = "C:\ffmpeg"

          Write-Host "Downloading FFmpeg full-shared archive from $url..."
          Invoke-WebRequest -Uri $url -OutFile $archive

          Write-Host "Extracting archive to $dest..."
          7z x $archive "-o$dest" -y | Out-Null

          $extractedRoot = (Get-ChildItem -Path $dest -Directory | Select-Object -First 1).FullName
          Write-Host "Discovered FFmpeg Root: $extractedRoot"

          $binDir = Join-Path $extractedRoot "bin"
          $includeDir = Join-Path $extractedRoot "include"
          $libDir = Join-Path $extractedRoot "lib"

          Write-Host "FFmpeg Bin: $binDir"
          Write-Host "FFmpeg Include: $includeDir"
          Write-Host "FFmpeg Lib: $libDir"

          # ffmpeg-sys-next looks for FFMPEG_DIR containing include/ and lib/
          "FFMPEG_DIR=$extractedRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$binDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "ffmpeg-bin=$binDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          # Ensure WiX toolset bin directory is in PATH if present
          if ($env:WIX -and (Test-Path "$env:WIX\bin")) {
            "$env:WIX\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      # --- Build Release Binary ---
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p ui --bin melody

      # --- Package Linux Artifacts (AppImage installer + portable tar.gz) ---
      - name: Package Linux release artifacts
        if: runner.os == 'Linux'
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
          fi

          mkdir -p dist-pkg

          # 1. Install AppImage packaging tools
          cargo install cargo-appimage
          sudo wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool.bin
          sudo chmod +x /usr/local/bin/appimagetool.bin
          printf '#!/bin/sh\nexport APPIMAGE_EXTRACT_AND_RUN=1\nunset SOURCE_DATE_EPOCH\nexec /usr/local/bin/appimagetool.bin --comp zstd "$@"\n' | sudo tee /usr/local/bin/appimagetool > /dev/null
          sudo chmod +x /usr/local/bin/appimagetool

          # 2. Build Linux AppImage
          (cd crates/ui && APPIMAGE_EXTRACT_AND_RUN=1 cargo appimage --target=${{ matrix.target }})

          # Locate built AppImage (cargo-appimage outputs in the crate root or target)
          APPIMAGE_FILE=$(find crates/ui target . -maxdepth 3 -name "*.AppImage" -not -path "*/dist-pkg/*" -type f | head -n 1)
          if [ -z "$APPIMAGE_FILE" ]; then
            echo "::error::AppImage was not generated"
            exit 1
          fi
          echo "Found AppImage at: $APPIMAGE_FILE"
          APPIMAGE_DEST="dist-pkg/melody-${RELEASE_TAG}-${{ matrix.target }}.AppImage"
          cp "$APPIMAGE_FILE" "$APPIMAGE_DEST"
          chmod +x "$APPIMAGE_DEST"

          # 3. Create portable tar.gz archive
          ARCHIVE_DIR="melody-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "$ARCHIVE_DIR"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$ARCHIVE_DIR/"
          cp -r themes "$ARCHIVE_DIR/"
          cp -r layouts "$ARCHIVE_DIR/"
          tar -czvf "dist-pkg/${ARCHIVE_DIR}.tar.gz" "$ARCHIVE_DIR"

      # --- Package Windows Artifacts (MSI installer + portable zip) ---
      - name: Package Windows release artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          }

          New-Item -ItemType Directory -Path "dist-pkg" -Force

          # 1. Install cargo-wix
          cargo install cargo-wix

          # 2. Populate WiX FFmpeg fragment dynamically with only the required FFmpeg DLLs
          $binDir = "${{ steps.setup-ffmpeg.outputs.ffmpeg-bin }}"
          $dlls = Get-ChildItem -Path $binDir -Filter "*.dll" | Where-Object { $_.Name -match '^(avcodec|avformat|avutil|swresample)' }
          $xml = @"
          <?xml version='1.0' encoding='utf-8'?>
          <Wix xmlns='http://schemas.microsoft.com/wix/2006/wi'>
            <Fragment>
              <ComponentGroup Id='FFmpegDlls' Directory='Bin'>
          "@
          foreach ($dll in $dlls) {
              $id = "dll_" + [System.Guid]::NewGuid().ToString("N")
              $cmpId = "cmp_" + [System.Guid]::NewGuid().ToString("N")
              $src = $dll.FullName.Replace("&", "&amp;")
              $xml += @"
                <Component Id='$cmpId' Guid='*'>
                  <File Id='$id' Source='$src' KeyPath='yes' />
                </Component>
          "@
          }
          $xml += @"
              </ComponentGroup>
            </Fragment>
          </Wix>
          "@
          Set-Content -Path "crates/ui/wix/ffmpeg.wxs" -Value $xml

          # 3. Build Windows MSI installer via cargo-wix
          $msiName = "melody-$tag-${{ matrix.target }}.msi"
          $targetBinDir = (Resolve-Path "target/${{ matrix.target }}/release").Path
          $msiOut = Join-Path (Resolve-Path "dist-pkg").Path $msiName
          try {
            Push-Location crates/ui
            cargo wix -p ui --no-build --nocapture --target ${{ matrix.target }} --target-bin-dir "$targetBinDir" -o "$msiOut"
            if ($LASTEXITCODE -ne 0) { throw "cargo-wix failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          # 4. Create portable zip archive
          $archiveDir = "melody-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $archiveDir -Force
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination $archiveDir
          Copy-Item -Recurse "themes" -Destination $archiveDir
          Copy-Item -Recurse "layouts" -Destination $archiveDir
          $dlls | ForEach-Object {
            Copy-Item $_.FullName -Destination $archiveDir
          }
          Compress-Archive -Path "$archiveDir\*" -DestinationPath "dist-pkg\$archiveDir.zip"

      - name: Upload artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: melody-${{ matrix.target }}
          path: dist-pkg/*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.msi" -o -name "*.AppImage" \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Determine tag
        id: release_info
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Extract tag message
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          git fetch --tags --force
          # Use subject + body (instead of %(contents)) to exclude any PGP signature block.
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" > TAG_BODY.md || true
          echo "---- Tag message for $TAG ----"
          cat TAG_BODY.md || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Melody ${{ steps.release_info.outputs.tag }}
          body_path: TAG_BODY.md
          draft: false
          prerelease: false
          generate_release_notes: false
          files: dist/*
