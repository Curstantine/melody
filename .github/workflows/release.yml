name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: melody
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: melody.exe
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Enable Rust caching
        uses: Swatinem/rust-cache@v2

      # --- Linux Dependencies ---
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            libavfilter-dev \
            libavdevice-dev \
            ffmpeg

      # --- Windows Dependencies ---
      - name: Set up FFmpeg (Windows)
        id: setup-ffmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z"
          $archive = "$env:TEMP\ffmpeg-release-full-shared.7z"
          $dest = "C:\ffmpeg"

          Write-Host "Downloading FFmpeg full-shared archive from $url..."
          Invoke-WebRequest -Uri $url -OutFile $archive

          Write-Host "Extracting archive to $dest..."
          7z x $archive "-o$dest" -y | Out-Null

          $extractedRoot = (Get-ChildItem -Path $dest -Directory | Select-Object -First 1).FullName
          Write-Host "Discovered FFmpeg Root: $extractedRoot"

          $binDir = Join-Path $extractedRoot "bin"
          $includeDir = Join-Path $extractedRoot "include"
          $libDir = Join-Path $extractedRoot "lib"

          Write-Host "FFmpeg Bin: $binDir"
          Write-Host "FFmpeg Include: $includeDir"
          Write-Host "FFmpeg Lib: $libDir"

          # ffmpeg-sys-next looks for FFMPEG_DIR containing include/ and lib/
          "FFMPEG_DIR=$extractedRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$binDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "ffmpeg-bin=$binDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # --- Build Release Binary ---
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p ui --bin melody

      # --- Package Artifacts ---
      - name: Package Linux release archive
        if: runner.os == 'Linux'
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
          fi
          
          ARCHIVE_DIR="melody-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "$ARCHIVE_DIR"
          
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$ARCHIVE_DIR/"
          cp -r themes "$ARCHIVE_DIR/"
          cp -r layouts "$ARCHIVE_DIR/"
          cp README.md AGENTS.md "$ARCHIVE_DIR/" 2>/dev/null || true
          
          tar -czvf "${ARCHIVE_DIR}.tar.gz" "$ARCHIVE_DIR"
          echo "ASSET_PATH=${ARCHIVE_DIR}.tar.gz" >> $GITHUB_ENV
          echo "ASSET_NAME=${ARCHIVE_DIR}.tar.gz" >> $GITHUB_ENV

      - name: Package Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          }
          
          $archiveDir = "melody-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $archiveDir -Force
          
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination $archiveDir
          Copy-Item -Recurse "themes" -Destination $archiveDir
          Copy-Item -Recurse "layouts" -Destination $archiveDir
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination $archiveDir }
          
          # Bundle the necessary FFmpeg runtime DLLs with the Windows binary
          $binDir = "${{ steps.setup-ffmpeg.outputs.ffmpeg-bin }}"
          Get-ChildItem -Path $binDir -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName -Destination $archiveDir
          }
          
          Compress-Archive -Path "$archiveDir\*" -DestinationPath "$archiveDir.zip"
          "ASSET_PATH=$archiveDir.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASSET_NAME=$archiveDir.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: melody-${{ matrix.target }}
          path: ${{ env.ASSET_PATH }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Determine tag
        id: release_info
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Extract tag message
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          git fetch --tags --force
          # Use subject + body (instead of %(contents)) to exclude any PGP signature block.
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" > TAG_BODY.md || true
          echo "---- Tag message for $TAG ----"
          cat TAG_BODY.md || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Melody ${{ steps.release_info.outputs.tag }}
          body_path: TAG_BODY.md
          draft: false
          prerelease: false
          generate_release_notes: false
          files: dist/*
