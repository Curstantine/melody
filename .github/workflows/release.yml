name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: melody
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: melody.exe
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}, wasm32-unknown-unknown

      - name: Enable Rust caching
        uses: Swatinem/rust-cache@v2

      # --- Linux Dependencies ---
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libfuse2

      # --- FFmpeg (Windows & Linux) ---
      - name: Set up minimal FFmpeg
        id: setup-ffmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Set up .NET (for Velopack packaging)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # --- Build Release Binary ---
      - name: Build release binary (Linux)
        if: runner.os == 'Linux'
        run: RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN' cargo build --release --target ${{ matrix.target }} -p ui --bin melody

      - name: Build release binary (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --target ${{ matrix.target }} -p ui --bin melody

      - name: Build bundled WASM extensions
        shell: bash
        env:
          MELODY_LASTFM_API_KEY: ${{ secrets.MELODY_LASTFM_API_KEY }}
          MELODY_LASTFM_API_SECRET: ${{ secrets.MELODY_LASTFM_API_SECRET }}
          MELODY_DISCORD_CLIENT_ID: ${{ secrets.MELODY_DISCORD_CLIENT_ID }}
        run: bash scripts/build-extensions.sh

      # --- Package Linux Artifacts (AppImage installer + portable tar.gz) ---
      - name: Package Linux release artifacts
        if: runner.os == 'Linux'
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
          fi
          CLEAN_VERSION="${RELEASE_TAG#v}"

          mkdir -p dist-pkg

          # 1. Install Velopack CLI
          dotnet tool install -g vpk

          # 2. Download previous release assets for delta generation (if available)
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" --outputDir dist-pkg --channel linux || true

          # 3. Prepare staging directory with all runtime assets & FFmpeg shared libraries
          STAGING_DIR="dist-staging"
          mkdir -p "$STAGING_DIR"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$STAGING_DIR/"
          cp -r themes "$STAGING_DIR/"
          cp -r layouts "$STAGING_DIR/"
          for ext in extensions/*; do
            if [ -f "$ext/extension.toml" ] && [ -f "$ext/extension.wasm" ]; then
              name=$(basename "$ext")
              mkdir -p "$STAGING_DIR/extensions/$name"
              cp "$ext/extension.toml" "$ext/extension.wasm" "$STAGING_DIR/extensions/$name/"
            fi
          done
          FFMPEG_LIB="${{ steps.setup-ffmpeg.outputs.linux }}"
          cp -a "$FFMPEG_LIB"/lib{avcodec,avformat,avutil,swresample}.so* "$STAGING_DIR/"

          # 4. Build Linux AppImage via Velopack
          vpk pack \
            --packId melody \
            --packVersion "$CLEAN_VERSION" \
            --packTitle Melody \
            --packAuthors Curstantine \
            --packDir "$STAGING_DIR" \
            --mainExe "${{ matrix.binary_name }}" \
            --icon assets/melody.png \
            --categories "AudioVideo;Audio;Player;Music;" \
            --channel linux \
            --outputDir dist-pkg

          # 5. Rename AppImage to melody-<tag>.AppImage
          APPIMAGE_FILE=$(find dist-pkg -maxdepth 2 -name "*.AppImage" -type f | head -n 1)
          if [ -n "$APPIMAGE_FILE" ]; then
            mv "$APPIMAGE_FILE" "dist-pkg/melody-${RELEASE_TAG}.AppImage"
            chmod +x "dist-pkg/melody-${RELEASE_TAG}.AppImage"
          fi

          # 6. Create portable tar.gz archive: melody-<tag>-portable.tar.gz
          PORTABLE_DIR="melody-${RELEASE_TAG}"
          mkdir -p "$PORTABLE_DIR"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$PORTABLE_DIR/"
          cp -r themes "$PORTABLE_DIR/"
          cp -r layouts "$PORTABLE_DIR/"
          for ext in extensions/*; do
            if [ -f "$ext/extension.toml" ] && [ -f "$ext/extension.wasm" ]; then
              name=$(basename "$ext")
              mkdir -p "$PORTABLE_DIR/extensions/$name"
              cp "$ext/extension.toml" "$ext/extension.wasm" "$PORTABLE_DIR/extensions/$name/"
            fi
          done
          cp -a "$FFMPEG_LIB"/lib{avcodec,avformat,avutil,swresample}.so* "$PORTABLE_DIR/"
          tar -czvf "dist-pkg/melody-${RELEASE_TAG}-portable.tar.gz" "$PORTABLE_DIR"
          rm -rf "$PORTABLE_DIR"

      # --- Package Windows Artifacts (Velopack Setup.exe + portable zip) ---
      - name: Package Windows release artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          }
          $cleanVersion = $tag.TrimStart('v')

          New-Item -ItemType Directory -Path "dist-pkg" -Force

          # 1. Install Velopack CLI
          dotnet tool install -g vpk

          # 2. Download previous release assets for delta generation (if available)
          try {
            vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" --outputDir dist-pkg --channel windows
          } catch {
            Write-Host "No previous release found or download skipped; proceeding with full release build."
          }

          # 3. Prepare staging directory with all runtime files & FFmpeg DLLs
          $stagingDir = "dist-staging"
          New-Item -ItemType Directory -Path $stagingDir -Force
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination $stagingDir
          Copy-Item -Recurse "themes" -Destination $stagingDir
          Copy-Item -Recurse "layouts" -Destination $stagingDir
          Get-ChildItem -Path "extensions" -Directory | ForEach-Object {
            $toml = Join-Path $_.FullName "extension.toml"
            $wasm = Join-Path $_.FullName "extension.wasm"
            if ((Test-Path $toml) -and (Test-Path $wasm)) {
              $extOut = Join-Path $stagingDir (Join-Path "extensions" $_.Name)
              New-Item -ItemType Directory -Path $extOut -Force | Out-Null
              Copy-Item $toml, $wasm -Destination $extOut
            }
          }
          $binDir = "${{ steps.setup-ffmpeg.outputs.win }}"
          $dlls = Get-ChildItem -Path $binDir -Filter "*.dll" | Where-Object { $_.Name -match '^(avcodec|avformat|avutil|swresample)' }
          $dlls | ForEach-Object {
            Copy-Item $_.FullName -Destination $stagingDir
          }

          # 4. Build Windows installer via Velopack
          vpk pack `
            --packId melody `
            --packVersion $cleanVersion `
            --packTitle Melody `
            --packAuthors Curstantine `
            --packDir $stagingDir `
            --mainExe melody.exe `
            --icon assets/melody.ico `
            --channel windows `
            --outputDir dist-pkg

          # 5. Rename installer and portable zip to melody-<tag>-setup.exe and melody-<tag>-portable.zip
          $setupExe = Get-ChildItem -Path "dist-pkg" -Filter "*Setup.exe" | Select-Object -First 1
          if ($setupExe) {
            Move-Item $setupExe.FullName "dist-pkg/melody-$tag-setup.exe" -Force
          }
          $portableZip = Get-ChildItem -Path "dist-pkg" -Filter "*Portable.zip" | Select-Object -First 1
          if ($portableZip) {
            Move-Item $portableZip.FullName "dist-pkg/melody-$tag-portable.zip" -Force
          }

      - name: Upload artifacts to GitHub Actions
        uses: actions/upload-artifact@v7
        with:
          name: melody-${{ matrix.target }}
          path: dist-pkg/*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.exe" -o -name "*.nupkg" -o -name "*.json" \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Determine tag
        id: release_info
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Extract tag message
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          git fetch --tags --force
          # Use subject + body (instead of %(contents)) to exclude any PGP signature block.
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" > TAG_BODY.md || true
          echo "---- Tag message for $TAG ----"
          cat TAG_BODY.md || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Melody ${{ steps.release_info.outputs.tag }}
          body_path: TAG_BODY.md
          draft: false
          prerelease: false
          generate_release_notes: false
          files: dist/*
