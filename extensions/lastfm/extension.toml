id = "melody.lastfm"
name = "Last.fm Scrobbler"
version = "0.1.0"
description = "Scrobble tracks and broadcast Now Playing updates to Last.fm."
authors = ["Melody"]
entry = "extension.wasm"
api_version = 1
permissions = ["playback-events", "network", "settings"]

[[settings]]
key = "api_key"
label = "API key"
type = "text"
default = ""
placeholder = "Enter Last.fm API key..."

[[settings]]
key = "api_secret"
label = "Shared secret"
type = "secret"
default = ""
placeholder = "Enter Last.fm shared secret..."

[[settings]]
key = "session_key"
label = "Session key (sk)"
description = "Obtain your API key and session key from your Last.fm API account settings"
type = "secret"
default = ""
placeholder = "Enter Last.fm session key (sk)..."

[[settings]]
key = "api_url"
label = "API endpoint URL"
type = "text"
default = "https://ws.audioscrobbler.com/2.0/"
placeholder = "https://ws.audioscrobbler.com/2.0/"

[[settings]]
key = "submit_now_playing"
label = "Submit \"Now Playing\" status"
description = "Broadcast current track to your Last.fm profile in real-time"
type = "toggle"
default = true

[[settings]]
key = "scrobble_percent"
label = "Scrobble threshold"
description = "Percentage of track duration that must play before recording a scrobble"
type = "number"
default = 50
min = 25
max = 100
step = 1
unit = "%"

[[settings]]
key = "test_connection"
label = "Connection"
description = "Verify your Last.fm API credentials and session key"
type = "action"
button_label = "Test connection"
